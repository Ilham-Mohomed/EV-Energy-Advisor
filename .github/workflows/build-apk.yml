
name: Build EV Energy Advisor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build APK on Expo
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          APK_URL=$(jq -r 'if type == "array" then .[0].artifacts.buildUrl // empty else .artifacts.buildUrl // empty end' eas-build.json)

          if [ -z "$APK_URL" ]; then
            echo "APK download URL was not found."
            cat eas-build.json
            exit 1
          fi

          curl --fail --location "$APK_URL" --output EV-Energy-Advisor.apk

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: EV-Energy-Advisor-APK
          path: EV-Energy-Advisor.apk
          retention-days: 90
